# Medlange Trainer's ruff configuration, standalone.
#
# The trainer is a standalone repository: it has no monorepo pyproject.toml to
# inherit from, and CI runs `ruff check medos_trainer tests` — without this
# file ruff falls back to its version-dependent DEFAULT rule set, and a newer
# ruff re-litigates rules this tree never signed up for (TRY004 and friends).
# The settings deliberately mirror the monorepo's [tool.ruff]: line-length 96,
# the same select list, Python 3.11.

line-length = 96
target-version = "py311"
# No src roots: with src-based detection the package at this repo's root
# classifies as first-party and every import block gains a blank line the
# byte-synced monorepo tree does not have. Classification below is explicit.
src = []

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "B905",  # zip(strict=) — the pairings in this tree are known-equal-length
]

[lint.isort]
# ruff >=0.9 auto-detects the package sitting beside this config as
# first-party, overriding known-third-party below; both must be set.
detect-same-package = false
# In this standalone checkout `medos_trainer` resolves as first-party (it is the
# package at the root), which would reformat every test import with a blank line
# the monorepo's config does not want — the tree is byte-synced with the
# monorepo, so one classification must hold in both places.
known-third-party = ["medos_trainer"]
