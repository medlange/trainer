# Medlange Trainer's ruff configuration, standalone.
#
# The trainer is a standalone repository: it has no monorepo pyproject.toml to
# inherit from, and CI runs `ruff check medos_trainer tests` — without this
# file ruff falls back to its version-dependent DEFAULT rule set, and a newer
# ruff re-litigates rules this tree never signed up for (TRY004 and friends).
# The settings deliberately mirror the monorepo's [tool.ruff]: line-length 96,
# the same select list, Python 3.11.

line-length = 96
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "B905",  # zip(strict=) — the pairings in this tree are known-equal-length
]
